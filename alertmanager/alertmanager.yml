global:
  resolve_timeout: 5m

route:
  receiver: "default-receiver"
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 12h
  group_by: ["alertname", "severity", "service"]

  routes:
    - matchers:
        - severity="critical"
      receiver: "critical-receiver"
      group_wait: 5s
      repeat_interval: 5m
      group_by: ["service", "severity"]

    - matchers:
        - severity="warning"
      receiver: "warning-receiver"
      group_wait: 30s
      repeat_interval: 30m
      group_by: ["alertname", "service"]

inhibit_rules:
  - source_matchers:
      - alertname="ServiceDown"
    target_matchers:
      - alertname=~"HighErrorRate|HighRequestLatency"
    equal: ["cluster", "environment", "service", "instance"]

  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["cluster", "environment", "service", "instance"]

receivers:
  - name: "default-receiver"
    webhook_configs:
      - url: "http://alert-receiver:5000/webhook/default"
        send_resolved: true

  - name: "critical-receiver"
    webhook_configs:
      - url: "http://alert-receiver:5000/webhook/critical"
        send_resolved: true

  - name: "warning-receiver"
    webhook_configs:
      - url: "http://alert-receiver:5000/webhook/warning"
        send_resolved: true
