global:
  resolve_timeout: 5m

route:
  receiver: "default-receiver"
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 12h
  group_by: ["alertname", "severity", "service"]

  routes:
    - match:
        severity: critical
      receiver: "critical-receiver"
      group_wait: 5s
      repeat_interval: 5m
      group_by: ["service", "severity"]

    - match:
        severity: warning
      receiver: "warning-receiver"
      group_wait: 30s
      repeat_interval: 30m
      group_by: ["alertname", "service"]

inhibit_rules:
  - source_match:
      alertname: "ServiceDown"
    target_match_re:
      alertname: "(HighErrorRate|HighRequestLatency)"
    equal: ["service"]

  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["service"]

receivers:
  - name: "default-receiver"
    webhook_configs:
      - url: "http://sample-app:5000/webhook/default"
        send_resolved: true

  - name: "critical-receiver"
    webhook_configs:
      - url: "http://sample-app:5000/webhook/critical"
        send_resolved: true

  - name: "warning-receiver"
    webhook_configs:
      - url: "http://sample-app:5000/webhook/warning"
        send_resolved: true
